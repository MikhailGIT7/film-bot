services:
  - type: web
    name: film-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: BOT_TOKEN
        value: your_bot_token_here
      - key: TMDB_API_KEY
        value: your_tmdb_api_key_here
      - key: WEBHOOK_HOST
        value: https://your-service-name.onrender.com